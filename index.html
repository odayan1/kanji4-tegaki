<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>4年 漢字 手書きれんしゅう（おためし版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2f7;--card:#fff;--ink:#22303a;--sub:#5f6f7a;--main:#d9542c;--blue:#2f6fa8;--ok:#23894f;--tri:#c27c00;--ng:#c93636;--line:#d4e0e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:21px;margin:6px 0 2px;font-weight:800}
.sub{color:var(--sub);font-size:13px}
.trybar{background:#fff4c2;border:2px solid #f0d77a;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:800;margin:8px 0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;border:1px solid var(--line)}
.tip{background:#e6f1f8;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.65}
.warn{background:#fdecea;border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.6;color:#8a2a1a;font-weight:800}
.unit{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.unit .no{font-size:12px;color:var(--sub)}
.unit .tt{font-weight:800;font-size:16px;line-height:1.35}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;font-size:16px;background:var(--main);color:#fff}
.btn.b{background:var(--blue)}
.btn.g{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{width:100%;padding:15px;font-size:19px;margin-top:10px}
.btn:disabled{opacity:.35}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font:inherit;font-size:14px;margin:10px auto 0;display:block}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 4px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top .x{background:#fff;border:2px solid var(--line);border-radius:10px;font:inherit;font-weight:800;font-size:14px;color:var(--sub);padding:6px 10px}
.pbar{flex:1;height:10px;background:#d6e3ec;border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.qn{font-size:13px;color:var(--sub);min-width:50px;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--main);border-radius:6px;padding:2px 8px}
.tag.w{color:#8a4b00;background:#ffe08a}
.tag.a{color:#2b3a8a;background:#dbe2ff}
.sent{font-family:"Klee One",serif;font-weight:600;font-size:27px;line-height:1.9;margin:12px 0 6px;word-break:break-all}
.sent u{text-decoration:none;border-bottom:4px solid var(--main);color:#b8321a}
.box{display:inline-block;border:3px solid var(--main);border-radius:8px;padding:0 8px;margin:0 2px;background:#fff;color:#b8321a;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:23px;line-height:1.5}
.slots{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.slot{width:56px;height:56px;border:3px solid var(--line);border-radius:8px;background:#fff;padding:0;position:relative}
.slot.on{border-color:var(--main);box-shadow:0 0 0 3px #f6c9b8}
.slot svg{width:100%;height:100%;display:block}
.slot .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b7c6d1;font-size:22px;font-weight:800}
.kana{font-family:"Klee One",serif;font-weight:600;font-size:30px;color:#8a8a8a;padding:0 2px 8px}
.okuri{font-family:"Klee One",serif;font-weight:600;font-size:22px;color:#9aa6ae;padding:0 2px 10px}
.padwrap{display:flex;flex-direction:column;align-items:center}
.padlbl{font-size:14px;font-weight:800;margin:4px 0 6px;align-self:flex-start}
canvas.pad{width:min(100%,clamp(220px,calc(100svh - 440px),340px));aspect-ratio:1/1;background:#fff;border:3px solid #9fb6c6;border-radius:6px;touch-action:none;display:block}
canvas.pad.done{touch-action:auto}
.padctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%;max-width:340px;margin-top:8px}
.padctl .btn{font-size:14px;padding:10px 4px}
.cnt{font-size:13px;color:var(--sub);margin-top:4px}
.jc{border:2px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.jhead{font-weight:800;font-size:16px;margin-bottom:6px}
.jrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jrow .lbl{font-size:12px;color:var(--sub);margin-bottom:2px}
.jrow svg{width:100%;aspect-ratio:1/1;background:#fff;border:2px solid #c9d7e1;border-radius:6px;display:block}
.jl{list-style:none;padding:0;margin:8px 0 0}
.jl li{display:flex;gap:8px;padding:6px 4px;font-size:15px;line-height:1.5;border-bottom:1px dashed var(--line)}
.jl li b.m{font-size:18px;min-width:22px;text-align:center}
.jl li.o b.m{color:var(--ok)} .jl li.s b.m{color:var(--tri)} .jl li.n b.m{color:#9aa6ae}
.jl .d{display:block;font-size:13px;color:#8a2a1a}
.jsum{font-size:19px;font-weight:800;text-align:center;margin:4px 0 6px}
.jsum.o{color:var(--ok)} .jsum.s{color:var(--tri)}
.answer{text-align:center;margin:6px 0}
.answer .k{font-family:"Klee One",serif;font-weight:600;font-size:72px;line-height:1.25;letter-spacing:.06em}
.answer .k .ok2{color:#8a8a8a}
.answer .lbl{font-size:13px;color:var(--sub)}
.wn{background:#fff4c2;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}
.kc{border:2px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fff}
.kc .hd{display:flex;align-items:center;gap:12px}
.kc .gl{font-family:"Klee One",serif;font-weight:600;font-size:60px;line-height:1;width:80px;height:80px;display:flex;align-items:center;justify-content:center;border:2px dashed #b9cbd8;border-radius:6px;background:#fff}
.kc .meta{font-size:13px;color:var(--sub)}
.kc .meta b{color:var(--ink);font-size:16px}
.pt{list-style:none;padding:0;margin:8px 0 0}
.pt li{padding:7px 8px;border-radius:8px;font-size:15px;line-height:1.5}
.pt li::before{content:"★ ";color:var(--ng)}
.pt .s{color:var(--sub);font-size:12px}
.nonote{font-size:13px;color:var(--sub);margin-top:6px}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.grade button{border:3px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:800;font-size:13px;padding:10px 4px;line-height:1.3}
.grade button b{display:block;font-size:30px}
.g-o b{color:var(--ok)} .g-s b{color:var(--tri)} .g-x b{color:var(--ng)}
.center{text-align:center}
.score{font-size:46px;font-weight:800;color:var(--main);margin:6px 0}
.mlist{list-style:none;padding:0;margin:8px 0;text-align:left}
.mlist li{padding:7px 0;border-bottom:1px dashed var(--line);font-family:"Klee One",serif;font-weight:600;font-size:18px}
.mlist li span{font-family:"M PLUS Rounded 1c";font-size:13px;color:var(--sub);margin-left:6px}
.foot{font-size:11px;color:var(--sub);margin-top:18px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="items.js"></script>
<script src="extra.js"></script>
<script src="notes.js"></script>
<script src="notes2.js"></script>
<script src="strokes.js"></script>
<script src="judge.js"></script>
<script>
(() => {
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isKanji = c => /\p{Script=Han}/u.test(c);
const TRYBAR = `<div class="trybar">✍️ 手書きの おためし版です（記録は しません）</div>`;

// ---- データ（kanji4-529 と同じ問題） ----
const ITEMS = [];
for (const u of UNITS) u.items.forEach((s, i) => {
  const [pre, k, oku, post, yomi, src] = s.split("|");
  ITEMS.push({ id: u.id + "-" + i, unit: u.id, pre, k, oku, post, yomi, src, weak: [...k].some(c => WEAK.includes(c)) });
});
const byUnit = id => ITEMS.filter(x => x.unit === id);
let shuf = true;
let S = null;

function home() {
  let h = `<h1>4年 漢字 手書きれんしゅう</h1>
  <div class="sub">漢字ドリル 5〜29（忘れもの 〜 季節の言葉 秋・力だめし）</div>${TRYBAR}
  <div class="tip">① 四角の ひらがなを 漢字で、<b>マスに 指で 書く</b><br>② 「はんてい」を おす → 画数・書き順・形を 見るよ<br>③ 答えと くらべて、自分で ○△× をつける</div>
  <div class="warn" style="margin-top:8px">とめ・はね・はらい、線の 長さ、つき出すか どうかは 判定しません。答えと くらべて 自分で 見てね。</div>`;
  for (const u of UNITS) {
    h += `<div class="card unit"><div><div class="no">ドリル ${u.no}（${byUnit(u.id).length}問）</div><div class="tt">${esc(u.title)}</div></div>
      <button class="btn" data-go="${u.id}">書く</button></div>`;
  }
  h += `<div class="card unit"><div><div class="no">5〜29 ぜんぶ（${ITEMS.length}問）</div><div class="tt">全部まとめて</div></div><button class="btn" data-go="all">書く</button></div>
    <div class="card unit"><div><div class="tt">⚠️ 要注意の字（${WEAK.join("・")}）</div><div class="no">まちがえやすい字を しっかり練習（${ITEMS.filter(x => x.weak).length}問）</div></div><button class="btn" data-go="weak">書く</button></div>
    <label class="toggle"><input type="checkbox" id="shuf" ${shuf ? "checked" : ""}> 問題の順番を まぜる</label>
    <div class="foot">※ 問題文は 漢字ドリル（光村図書 4年下 準拠）5〜29 より。答えの字は 教科書体に近い「Klee One」で表示しています。<br>※ 書き順のデータと はんていの お手本は KanjiVG（CC BY-SA 3.0, Ulrich Apel, https://kanjivg.tagaini.net）を元にしています。字の形は 答えの大きな字（教科書体）を見てね。<br>※ はんていは 機械による 参考です。先生や 答えと くらべて たしかめよう。</div>`;
  $app.innerHTML = h;
  $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => start(b.dataset.go));
  document.getElementById("shuf").onchange = e => { shuf = e.target.checked; };
  window.scrollTo(0, 0);
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start(target, only) {
  let list = only ? only.slice() : target === "all" ? ITEMS.slice() : target === "weak" ? ITEMS.filter(x => x.weak) : byUnit(target);
  const seenQ = new Set(); list = list.filter(x => { const key = x.pre + x.k + x.oku + x.post; if (seenQ.has(key)) return false; seenQ.add(key); return true; });
  if (shuf) shuffle(list);
  const title = target === "all" ? "全部まとめて" : target === "weak" ? "要注意の字" : "ドリル " + UNITS.find(u => u.id === target).no;
  S = { target, title, q: list.map(it => ({ it })), i: 0, ok: 0, first: list.length, miss: [], auto: { o: 0, n: 0 } };
  show();
}
function topBar() {
  const p = Math.min(S.i, S.q.length) / S.q.length * 100;
  return `<div class="top"><button class="x" id="quit">🏠 ホーム</button><div class="pbar"><i style="width:${p}%"></i></div><div class="qn">${Math.min(S.i + 1, S.q.length)} / ${S.q.length}</div></div>`;
}

// ---- 書く画面 ----
let W = null; // いまの問題の 書きの状態
function show() {
  if (S.i >= S.q.length) return result();
  const { it, again } = S.q[S.i];
  const chars = [...it.k];
  W = { it, slots: chars.map((c, ci) => isKanji(c) ? { c, ci, strokes: [] } : null).filter(Boolean), sel: 0, done: false };
  const tag = `<span class="tag">書き</span>${it.weak ? ` <span class="tag w">要注意</span>` : ""}${again ? ` <span class="tag a">もう一回</span>` : ""}`;
  let slotsH = "";
  let si = 0;
  for (const c of chars) {
    if (isKanji(c)) { slotsH += `<button class="slot" data-s="${si}" aria-label="${si + 1}字目"><div class="q">${si + 1}</div><svg viewBox="0 0 109 109"></svg></button>`; si++; }
    else slotsH += `<span class="kana">${esc(c)}</span>`;
  }
  if (it.oku) slotsH += `<span class="okuri">（${esc(it.oku)}）</span>`;
  const multi = W.slots.length > 1;
  $app.innerHTML = TRYBAR + topBar() + `<div class="card" id="qcard">${tag}
    <div class="sent">${esc(it.pre)}<span class="box">${esc(it.yomi + it.oku)}</span>${esc(it.post)}</div>
    <div class="sub">四角の ひらがなを 漢字で 書こう。${it.oku ? "送りがなは 書かなくて いいよ。" : ""}${multi ? `漢字は ${W.slots.length}字。1字ずつ マスに 書いてね。` : ""}</div>
    <div class="slots">${slotsH}</div>
    <div class="padwrap"><div class="padlbl" id="padlbl"></div>
      <canvas class="pad" id="pad"></canvas>
      <div class="cnt" id="cnt"></div>
      <div class="padctl"><button class="btn g" id="undo">↩ 1画 もどす</button><button class="btn g" id="clr">🗑 ぜんぶ消す</button><button class="btn b" id="nextc">${multi ? "つぎの字 →" : "　"}</button></div>
    </div>
    <button class="btn big" id="judge" disabled>はんてい する</button>
    <button class="link" id="dk">わからない（答えを見る）</button></div><div id="rev"></div>`;
  document.getElementById("quit").onclick = () => { if (confirm("ここで やめて ホームに もどる？")) home(); };
  if (!multi) document.getElementById("nextc").style.visibility = "hidden";
  $app.querySelectorAll(".slot").forEach(b => b.onclick = () => { if (!W.done) { W.sel = +b.dataset.s; refresh(); } });
  document.getElementById("undo").onclick = () => { const s = W.slots[W.sel]; s.strokes.pop(); refresh(); };
  document.getElementById("clr").onclick = () => { W.slots[W.sel].strokes = []; refresh(); };
  document.getElementById("nextc").onclick = () => { W.sel = (W.sel + 1) % W.slots.length; refresh(); };
  document.getElementById("judge").onclick = () => doJudge();
  document.getElementById("dk").onclick = () => reveal(null);
  setupPad();
  refresh();
  window.scrollTo(0, 0);
}

function strokesSVG(strokes, opt) {
  opt = opt || {};
  const bad = opt.bad || [];
  return strokes.map((s, i) => {
    const pts = s.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const col = bad.includes(i) ? "#d62020" : "#22303a";
    const dot = s.length < 2 ? `<circle cx="${s[0][0]}" cy="${s[0][1]}" r="2.5" fill="${col}"/>` : `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${opt.w || 4.5}" stroke-linecap="round" stroke-linejoin="round"/>`;
    const num = opt.num ? `<text x="${Math.max(3, s[0][0] - 5)}" y="${Math.max(9, s[0][1] - 2)}" font-size="8" font-family="sans-serif" font-weight="700" fill="${bad.includes(i) ? "#d62020" : "#6b7f8c"}">${i + 1}</text>` : "";
    return dot + num;
  }).join("");
}
const GRID = `<line x1="54.5" y1="0" x2="54.5" y2="109" stroke="#d9e4ec" stroke-dasharray="3 3"/><line x1="0" y1="54.5" x2="109" y2="54.5" stroke="#d9e4ec" stroke-dasharray="3 3"/>`;

function refresh() {
  const s = W.slots[W.sel];
  $app.querySelectorAll(".slot").forEach((b, i) => {
    b.classList.toggle("on", i === W.sel);
    const st = W.slots[i].strokes;
    b.querySelector(".q").classList.toggle("hidden", st.length > 0);
    b.querySelector("svg").innerHTML = strokesSVG(st, { w: 6 });
  });
  document.getElementById("padlbl").textContent = W.slots.length > 1 ? `✏️ ${W.sel + 1}字目を 書こう` : "✏️ ここに 書こう";
  const empty = W.slots.findIndex(x => !x.strokes.length);
  document.getElementById("cnt").textContent = s.strokes.length ? `${s.strokes.length}画 書いたよ${!W.done && empty >= 0 && W.slots.length > 1 ? `。${empty + 1}字目も 書いてね` : ""}` : "指で 1画ずつ 書いてね";
  document.getElementById("undo").disabled = W.done || !s.strokes.length;
  document.getElementById("clr").disabled = W.done || !s.strokes.length;
  document.getElementById("nextc").disabled = W.done;
  document.getElementById("pad").classList.toggle("done", W.done);
  document.getElementById("judge").disabled = W.done || W.slots.some(x => !x.strokes.length);
  drawPad();
}

// ---- 指で書くマス ----
let pad = null;
function setupPad() {
  const cv = document.getElementById("pad");
  pad = { cv, ctx: cv.getContext("2d"), cur: null };
  const toXY = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 109, (e.clientY - r.top) / r.height * 109]; };
  cv.addEventListener("pointerdown", e => {
    if (W.done) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    pad.cur = [toXY(e)]; drawPad();
  });
  cv.addEventListener("pointermove", e => {
    if (!pad.cur) return; e.preventDefault();
    const p = toXY(e), q = pad.cur[pad.cur.length - 1];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.6) { pad.cur.push(p); drawPad(); }
  });
  const end = e => {
    if (!pad.cur) return;
    W.slots[W.sel].strokes.push(pad.cur); pad.cur = null; refresh();
  };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  window.onresize = drawPad;
}
function drawPad() {
  if (!pad || !document.body.contains(pad.cv)) return;
  const cv = pad.cv, r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const pw = Math.round(r.width * dpr), ph = Math.round(r.height * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }  // 幅と高さの 両方を 見る
  const ctx = pad.ctx, k = cv.width / 109;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.strokeStyle = "#d9e4ec"; ctx.lineWidth = 0.6; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(54.5, 0); ctx.lineTo(54.5, 109); ctx.moveTo(0, 54.5); ctx.lineTo(109, 54.5); ctx.stroke(); ctx.setLineDash([]);
  const all = W.slots[W.sel].strokes.concat(pad.cur ? [pad.cur] : []);
  ctx.strokeStyle = "#1f2a33"; ctx.fillStyle = "#1f2a33"; ctx.lineWidth = 4.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  all.forEach(s => {
    if (s.length < 2) { ctx.beginPath(); ctx.arc(s[0][0], s[0][1], 2.1, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); s.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke();
  });
}

// ---- はんてい ----
function doJudge() {
  W.done = true; refresh();
  const results = W.slots.map(s => TEGAKI.judgeChar(s.c, s.strokes));
  W.results = results;
  reveal(results);
}
function judgeHTML(results) {
  const allOk = results.every(r => r && r.ok);
  let h = `<div class="card"><div style="font-weight:800;color:var(--sub);font-size:13px">はんてい（参考）</div>
    <div class="jsum ${allOk ? "o" : "s"}">${allOk ? "◎ よく書けたね！" : "△ の ところを 見なおそう"}</div>${allOk ? `<div class="sub" style="margin:-2px 0 6px">◎でも、下の ★ドリルの 注意を 見て、線の 長さ・つき出しを たしかめてね。</div>` : ""}`;
  results.forEach((r, k) => {
    const s = W.slots[k];
    if (!r) { h += `<div class="jc">「${esc(s.c)}」は はんていできません</div>`; return; }
    const badU = r.order.bad.map(b => b.i);
    const msgs = r.order.bad.slice(0, 3).map(b => b.kind === "order" ? `${b.i + 1}画目に 書いた線は、ほんとうは ${b.j + 1}画目の線みたい。ほんとうの ${b.i + 1}画目は お手本の 赤い線だよ`
      : b.kind === "dir" ? `${b.i + 1}画目の 向きが 反対みたい（赤い線の 書きはじめを 見てね）` : `${b.i + 1}画目の 場所か 形が ちがうみたい（赤い線）`);
    if (r.order.bad.length > 3) msgs.push(`ほかにも ${r.order.bad.length - 3}か所`);
    const li = (st, label, d) => `<li class="${st}"><b class="m">${st === "o" ? "○" : st === "s" ? "△" : "－"}</b><div>${label}${d ? `<span class="d">${d}</span>` : ""}</div></li>`;
    h += `<div class="jc">${results.length > 1 ? `<div class="jhead">${k + 1}字目「${esc(s.c)}」</div>` : ""}
      <div class="jrow"><div><div class="lbl">あなたの字（数字は 書いた順）</div><svg viewBox="0 0 109 109">${GRID}${strokesSVG(s.strokes, { num: true, bad: r.count.ok ? badU : [] })}</svg></div>
      <div><div class="lbl">お手本の書き順</div><svg viewBox="0 0 109 109" id="jv${k}"></svg><button class="btn g" style="width:100%;margin-top:6px;font-size:13px;padding:7px" data-replay="${k}">▶ もう一回 見る</button></div></div>
      <ul class="jl">
        ${li(r.count.ok ? "o" : "s", r.count.ok ? `画数：${r.count.ref}画 ばっちり` : `画数：あなたは ${r.count.user}画、正しくは ${r.count.ref}画`, r.count.ok ? "" : (r.count.user > r.count.ref ? "1画で 書く線を 分けて いないかな？" : "2画に 分ける線を つなげて いないかな？"))}
        ${r.order.checked ? li(r.order.ok ? "o" : "s", r.order.ok ? "書き順：ばっちり" : "書き順・向き：見なおそう", msgs.join("<br>")) : li("n", "書き順：画数が ちがうので 見られないよ", "")}
        ${li(r.shape.ok ? "o" : "s", r.shape.ok ? "形：だいたい 合っているよ" : "形：お手本と くらべて みよう", "")}
      </ul></div>`;
  });
  h += `<div class="warn">とめ・はね・はらい、線の 長さ、つき出すか どうかは 判定しません。答えと くらべて 自分で 見てね。</div>
    <button class="btn g" id="rewrite" style="width:100%;margin-top:8px">✏️ 消して 書きなおす</button></div>`;
  return h;
}

// ---- 答えと注意・自己採点 ----
function reveal(results) {
  const it = W.it;
  document.getElementById("judge").classList.add("hidden");
  document.getElementById("dk").classList.add("hidden");
  W.done = true; refresh();
  const uniq = [...new Set([...it.k].filter(isKanji))];
  let h = results ? judgeHTML(results) : "";
  h += `<div class="card"><div class="answer"><div class="lbl">こたえ</div>
    <div class="k">${[...it.k].map(c => isKanji(c) ? esc(c) : `<span class="ok2">${esc(c)}</span>`).join("")}<span class="ok2">${esc(it.oku)}</span></div>
    <div class="sent" style="font-size:20px;margin:0">${esc(it.pre)}<u>${esc(it.k)}</u>${esc(it.oku)}${esc(it.post)}</div></div>`;
  if (WORD_NOTES[it.k]) h += `<div class="wn">💡 ${esc(WORD_NOTES[it.k])}</div>`;
  h += `<div style="font-weight:800;margin-top:10px">ここに 気をつけて！（ドリルの 注意）</div>`;
  h += uniq.map(c => {
    const N = NOTES[c], st = STROKES[c] || [];
    return `<div class="kc"><div class="hd"><div class="gl">${esc(c)}</div><div class="meta"><b>${st.length}画</b>${WEAK.includes(c) ? ` <span style="color:#b45309;font-weight:800">⚠️ 要注意の字</span>` : ""}</div></div>
      ${N ? `<ul class="pt">${N.p.map(p => `<li>${esc(p.t)}${p.s.length ? ` <span class="s">（${p.s.join("・")}画目）</span>` : ""}</li>`).join("")}</ul>` : `<div class="nonote">前の学年までに ならった字。形を 見て たしかめよう。</div>`}</div>`;
  }).join("");
  if (!results) h = `<div class="card"><div style="font-weight:800">お手本の 書き順</div><div class="jrow">${W.slots.map((s, k) => `<div><div class="lbl">${W.slots.length > 1 ? `${k + 1}字目「${esc(s.c)}」` : `「${esc(s.c)}」`}</div><svg viewBox="0 0 109 109" id="jv${k}"></svg><button class="btn g" style="width:100%;margin-top:6px;font-size:13px;padding:7px" data-replay="${k}">▶ もう一回 見る</button></div>`).join("")}</div>
    <button class="btn" id="rewrite" style="width:100%;margin-top:10px">✏️ 見ながら 書いてみる</button></div>` + h;
  h += `<div style="font-weight:800;margin-top:12px">自分で 丸つけ しよう</div>
    <div class="grade"><button class="g-o" data-g="o"><b>○</b>ばっちり</button><button class="g-s" data-g="s"><b>△</b>形が<br>あやしい</button><button class="g-x" data-g="x"><b>×</b>書けな<br>かった</button></div></div>`;
  const rev = document.getElementById("rev");
  rev.innerHTML = h;
  {
    W.slots.forEach((s, k) => { const r = results ? results[k] : null; if (r || !results) playRef(k, r); });
    rev.querySelectorAll("[data-replay]").forEach(b => b.onclick = () => { const k = +b.dataset.replay; playRef(k, results ? results[k] : null); });
    document.getElementById("rewrite").onclick = () => {
      W.slots.forEach(s => s.strokes = []); W.done = false; W.sel = 0; rev.innerHTML = "";
      document.getElementById("judge").classList.remove("hidden"); document.getElementById("dk").classList.remove("hidden");
      refresh(); document.getElementById("qcard").scrollIntoView({ behavior: "smooth", block: "start" });
    };
  }
  rev.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grade(it, b.dataset.g, results));
  rev.scrollIntoView({ behavior: "smooth", block: "start" });
}

const timers = {};
function playRef(k, r) {
  const c = W.slots[k].c, st = STROKES[c] || [], svg = document.getElementById("jv" + k);
  if (!svg) return;
  const hl = r && r.count.ok ? r.order.bad.map(b => b.i) : [];
  (timers[k] || []).forEach(clearTimeout); timers[k] = [];
  svg.innerHTML = GRID + st.map(d => `<path d="${d}" fill="none" stroke="#e3eaef" stroke-width="3.4" stroke-linecap="round"/>`).join("")
    + st.map((d, i) => `<path class="an" d="${d}" fill="none" stroke="${hl.includes(i) ? "#e02424" : "#22303a"}" stroke-width="${hl.includes(i) ? 4.4 : 3.4}" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"/>`).join("");
  const paths = [...svg.querySelectorAll("path.an")];
  let t = 0;
  paths.forEach((p, i) => {
    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    const dur = Math.max(300, L * 8);
    timers[k].push(setTimeout(() => {
      p.style.opacity = 1; p.style.transition = `stroke-dashoffset ${dur}ms linear`;
      requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
      const m = st[i].match(/M\s*([\d.]+)[ ,]([\d.]+)/), x = m ? +m[1] : 0, y = m ? +m[2] : 0;
      svg.insertAdjacentHTML("beforeend", `<text x="${Math.max(3, x - 5)}" y="${Math.max(9, y - 2)}" font-size="8" font-family="sans-serif" font-weight="700" fill="${hl.includes(i) ? "#d62020" : "#6b7f8c"}">${i + 1}</text>`);
    }, t));
    t += dur + 200;
  });
}

function grade(it, g, results) {
  const q = S.q[S.i];
  if (!q.again) {
    if (g === "o") S.ok++; else S.miss.push(it);
    if (results) { S.auto.n++; if (results.every(r => r && r.ok)) S.auto.o++; }
  }
  // 正解した問題は くり返さない。△・× だけ 最後に もう一回（1回まで）
  if (g !== "o" && !q.again) S.q.push({ it, again: true });
  S.i++; show();
}

function result() {
  const pct = Math.round(S.ok / S.first * 100);
  const msg = pct === 100 ? "パーフェクト！🎉" : pct >= 80 ? "よくできました！" : pct >= 50 ? "あと少し！" : "まちがえた所を もう一回 やろう";
  const uniqMiss = [...new Map(S.miss.map(x => [x.id, x])).values()];
  $app.innerHTML = TRYBAR + `<div class="card center"><div class="sub">${esc(S.title)}（書き）</div>
    <div class="score">${S.ok} / ${S.first}</div><div style="font-size:20px;font-weight:800">${msg}</div>
    <div class="sub" style="margin-top:6px">自分で つけた ○ の数だよ${S.auto.n ? `（はんていで ◎ だったのは ${S.auto.o} / ${S.auto.n}）` : ""}</div>
    ${uniqMiss.length ? `<div style="font-weight:800;margin-top:14px;text-align:left">△・× だった ことば</div><ul class="mlist">${uniqMiss.map(x => `<li>${esc(x.k)}${esc(x.oku)}<span>（${esc(x.yomi + x.oku)}）</span></li>`).join("")}</ul>` : ""}
    ${uniqMiss.length ? `<button class="btn big" id="missonly">△・× だけ もう一回</button>` : ""}
    <button class="btn big${uniqMiss.length ? " g" : ""}" id="again">ぜんぶ もう一回 やる</button>
    <button class="btn big g" id="home">🏠 ホームに もどる</button></div>`;
  document.getElementById("again").onclick = () => start(S.target);
  if (uniqMiss.length) document.getElementById("missonly").onclick = () => start(S.target, uniqMiss);
  document.getElementById("home").onclick = home;
}

home();
})();
</script>
</body>
</html>
